server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path that isn't a real
    # file must fall back to index.html so refreshing on e.g. /requests works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
