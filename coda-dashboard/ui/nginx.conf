server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # $host strips the port from the Host header — $http_host preserves it,
    # which matters for non-default ports (e.g. localhost:5000). Declared at
    # server level so both proxying locations below inherit them (a location
    # or `if` block that sets none of its own inherits the parent's fully;
    # nginx forbids proxy_set_header directly inside an `if` block anyway).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # /oauth/authorize is both a page (GET — React Router renders the
    # consent screen, OAuthAuthorizePage.jsx) and an API call (POST — that
    # page's own "Allow" button). Route by method: only POST goes to the
    # gateway, GET falls through to the SPA like any other client-side route.
    location = /oauth/authorize {
        if ($request_method = POST) {
            proxy_pass http://api-gateway:8000;
        }
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API paths to the gateway so the browser only ever talks
    # to this origin — avoids hardcoding the gateway's port in the frontend
    # and keeps the OAuth redirect_uri host/proto correct behind any reverse
    # proxy in front of this container.
    location ~ ^/(auth|datasets|users|query|role-changes|oauth) {
        proxy_pass http://api-gateway:8000;
    }

    # React Router uses client-side routing — any path that isn't a real
    # file must fall back to index.html so refreshing on e.g. /requests works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
