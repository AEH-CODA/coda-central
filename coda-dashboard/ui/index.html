<!DOCTYPE html>
<html>
<head>
  <title>CODA Data Discovery UI</title>
</head>
<body>

<h2>CODA Data Discovery UI</h2>

<input id="query" placeholder="Enter natural language query" size="60">
<button onclick="submitQuery()">Submit</button>

<h3>Results</h3>
<table id="resultsTable"></table>

<h3>Raw API Response (debug)</h3>
<pre id="result"></pre>

<button onclick="logout()">Logout</button>

<script>

// const accessToken = localStorage.getItem("token")
if (!localStorage.getItem("token")) {
  window.location.href = "/login.html";
}

async function submitQuery() {
  const query = document.getElementById("query").value;

  const token = localStorage.getItem("token");
  if (!token) {
    alert("You are not logged in");
    return;
  }

  const response = await fetch(
    "http://" + window.location.hostname + ":8000/query",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ query })
    }
  );

  const data = await response.json();
  document.getElementById("result").textContent =
    JSON.stringify(data, null, 2);

  renderTable(data.results);
}

function renderTable(sparqlResults) {
  const table = document.getElementById("resultsTable");
  table.innerHTML = ""; // clear previous results

  if (!sparqlResults || !sparqlResults.results.bindings.length) {
    table.innerHTML = "<tr><td>No results</td></tr>";
    return;
  }

  const columns = sparqlResults.head.vars;
  const rows = sparqlResults.results.bindings;

  // Header row
  const headerRow = document.createElement("tr");
  columns.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col;
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  // Data rows
  rows.forEach(row => {
    const tr = document.createElement("tr");
    columns.forEach(col => {
      const td = document.createElement("td");
      td.textContent = row[col]?.value || "";
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "/login.html";
}

</script>

</body>
</html>
