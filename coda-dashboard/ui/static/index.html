<!DOCTYPE html>
<html>
<head>
  <title>CODA Data Discovery UI</title>
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>CODA</h1>
    <p>Data Discovery Platform</p>
  </div>

  <nav class="nav-buttons">
    <button class="nav-btn active" onclick="setActiveNav(this)">
      Query Data
    </button>
    <button class="nav-btn" onclick="navigateToSavedDatasets()">
      Saved Datasets
    </button>
    <button class="nav-btn" onclick="setActiveNav(this)">
      Model Workspace
    </button>
  </nav>

  <div class="sidebar-footer">
    <button class="signout-btn" onclick="logout()">
      Sign Out
    </button>
  </div>
</aside>

<main class="main-content">
  <div class="content-header">
    <h2>QUERY DATA</h2>
    <p>Discover insights with natural language queries</p>
  </div>

  <div class="query-section">
    <div class="query-input-group">
      <input id="query" type="text" placeholder="Enter natural language query (e.g., 'Show me all patients with diabetes')">
      <button class="submit-btn" onclick="submitQuery()">Search</button>
    </div>
  </div>

  <div class="results-section">
    <h3>Results</h3>
    <div class="results-controls">
      <button class="save-dataset-btn" id="saveDatasetBtn" onclick="showSaveDatasetDialog()" style="display: none;">
        Save Dataset
      </button>
    </div>
    <div class="results-table-container">
      <table id="resultsTable"></table>
    </div>

    <div class="debug-section">
      <h4>Raw API Response</h4>
      <pre id="result"></pre>
    </div>
  </div>

  <!-- Save Dataset Modal -->
  <div id="saveDatasetModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" onclick="closeSaveDatasetDialog()">&times;</span>
      <h2>Save Dataset</h2>
      <form id="saveDatasetForm">
        <div class="form-group">
          <label for="datasetName">Dataset Name *</label>
          <input type="text" id="datasetName" name="datasetName" required placeholder="e.g., Diabetes Patients 2024">
        </div>
        <div class="form-group">
          <label for="datasetDescription">Description</label>
          <textarea id="datasetDescription" name="datasetDescription" placeholder="Optional description of your dataset"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Dataset</button>
          <button type="button" class="btn-secondary" onclick="closeSaveDatasetDialog()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</main>

<script>

// Handle token from OAuth callback
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
if (token) {
  localStorage.setItem('token', token);
  window.history.replaceState({}, document.title, "/");
}

// Check if authenticated
if (!localStorage.getItem("token")) {
  window.location.href = "/login.html";
}

// Store current query results for saving as dataset
let currentQueryData = null;

// Restore previous query results from localStorage if available
window.addEventListener('DOMContentLoaded', function() {
  const savedQueryData = localStorage.getItem('currentQueryData');
  if (savedQueryData) {
    try {
      currentQueryData = JSON.parse(savedQueryData);
      // Restore the query text
      const savedQuery = localStorage.getItem('lastQuery');
      if (savedQuery) {
        document.getElementById('query').value = savedQuery;
      }
      // Restore results display
      document.getElementById('result').textContent = JSON.stringify(currentQueryData, null, 2);
      renderTable(currentQueryData.results);
      // Show save dataset button
      if (!currentQueryData.error) {
        document.getElementById('saveDatasetBtn').style.display = 'block';
      }
    } catch (e) {
      console.log('Could not restore previous query data');
    }
  }
});

function setActiveNav(button) {
  // Remove active class from all buttons
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  // Add active class to clicked button
  button.classList.add('active');
}

function navigateToSavedDatasets() {
  window.location.href = "/saved-datasets.html";
}

async function submitQuery() {
  const query = document.getElementById("query").value;

  if (!query.trim()) {
    alert("Please enter a query");
    return;
  }

  const token = localStorage.getItem("token");
  if (!token) {
    alert("You are not logged in");
    return;
  }

  try {
    const response = await fetch(
      "http://" + window.location.hostname + ":8000/query",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ query })
      }
    );

    const data = await response.json();
    currentQueryData = data;  // Store for later saving
    
    // Persist to localStorage for session recovery
    localStorage.setItem('currentQueryData', JSON.stringify(data));
    localStorage.setItem('lastQuery', query);
    
    document.getElementById("result").textContent =
      JSON.stringify(data, null, 2);

    renderTable(data.results);
    
    // Show save dataset button if query was successful
    if (!data.error) {
      document.getElementById("saveDatasetBtn").style.display = "block";
      // Reset button to default state when new query is executed
      resetSaveDatasetButton();
    }
  } catch (error) {
    document.getElementById("result").textContent = "Error: " + error.message;
    document.getElementById("saveDatasetBtn").style.display = "none";
  }
}

function renderTable(sparqlResults) {
  const table = document.getElementById("resultsTable");
  table.innerHTML = "";

  if (!sparqlResults || !sparqlResults.results.bindings.length) {
    table.innerHTML = "<tr><td class='no-results' colspan='100'>No results found</td></tr>";
    return;
  }

  const columns = sparqlResults.head.vars;
  const rows = sparqlResults.results.bindings;

  const headerRow = document.createElement("tr");
  columns.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col;
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  rows.forEach(row => {
    const tr = document.createElement("tr");
    columns.forEach(col => {
      const td = document.createElement("td");
      td.textContent = row[col]?.value || "";
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
}

function showSaveDatasetDialog() {
  if (!currentQueryData) {
    alert("No query results to save");
    return;
  }
  document.getElementById("saveDatasetModal").style.display = "block";
}

function closeSaveDatasetDialog() {
  document.getElementById("saveDatasetModal").style.display = "none";
  document.getElementById("saveDatasetForm").reset();
}

function resetSaveDatasetButton() {
  // Reset button to default state (for new queries)
  const btn = document.getElementById("saveDatasetBtn");
  btn.innerHTML = "Save Dataset";
  btn.classList.remove("saved");
  btn.style.background = "";
  btn.disabled = false;
}

function markDatasetAsSaved() {
  // Update button to show saved state with green and checkmark
  const btn = document.getElementById("saveDatasetBtn");
  btn.innerHTML = "Dataset Saved";
  btn.classList.add("saved");
  btn.disabled = true;
  btn.style.background = "#28a745";
}

// Handle save dataset form submission
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('saveDatasetForm');
  if (form) {
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const datasetName = document.getElementById('datasetName').value;
      const datasetDescription = document.getElementById('datasetDescription').value;
      const token = localStorage.getItem('token');
      
      if (!currentQueryData) {
        alert('No query results to save');
        return;
      }
      
      try {
        const response = await fetch(
          'http://' + window.location.hostname + ':8000/datasets',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
              nl_query: currentQueryData.nl_query,
              sparql_query: currentQueryData.sparql,
              results: currentQueryData.results,
              name: datasetName,
              description: datasetDescription
            })
          }
        );
        
        if (response.ok) {
          const result = await response.json();
          // Mark button as saved with green + checkmark
          markDatasetAsSaved();
          // Close modal and show success
          closeSaveDatasetDialog();
          alert('Dataset saved successfully! ID: ' + result.dataset_id);
        } else {
          alert('Failed to save dataset');
        }
      } catch (error) {
        alert('Error saving dataset: ' + error.message);
      }
    });
  }
});

// Close modal when clicking outside of it
window.onclick = function(event) {
  const modal = document.getElementById("saveDatasetModal");
  if (event.target == modal) {
    modal.style.display = "none";
  }
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "/login.html";
}

</script>

</body>
</html>
