<!DOCTYPE html>
<html>
<head>
  <title>CODA Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px 40px;
      max-width: 420px;
      width: 100%;
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .logo-text {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    h2 {
      color: #333;
      margin-bottom: 12px;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .content-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .google-login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      color: #333;
      margin-bottom: 20px;
    }

    .google-login-btn:hover {
      background-color: #f8f9fa;
      border-color: #667eea;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
      transform: translateY(-2px);
    }

    .google-login-btn:active {
      transform: translateY(0);
    }

    .google-logo {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 30px 0;
      color: #ccc;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: #e0e0e0;
    }

    .divider-text {
      font-size: 13px;
      color: #999;
    }

    .info-box {
      background: #f5f6fa;
      border-left: 4px solid #667eea;
      padding: 16px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    #message {
      color: #d32f2f;
      margin-top: 20px;
      padding: 12px;
      background-color: #ffebee;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    #message.show {
      display: block;
    }

    .footer-text {
      font-size: 12px;
      color: #999;
      margin-top: 20px;
    }

    .footer-text a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo-section">
    <div class="logo-text">CODA</div>
  </div>

  <div class="content-section">
    <h2>Data Discovery</h2>
    <p class="subtitle">Sign in to access the CODA platform</p>

    <div class="info-box">
      Secure Google authentication required. Your data is protected.
    </div>

    <button class="google-login-btn" onclick="loginWithGoogle()">
      <svg class="google-logo" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>
  </div>

  <p id="message"></p>

  <p class="footer-text">
    By signing in, you agree to our platform terms.<br>
    We never share your data without permission.
  </p>
</div>

<script>
// Check if already logged in via token in URL
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
if (token) {
  localStorage.setItem('token', token);
  window.history.replaceState({}, document.title, "/");
  window.location.href = "/";
}

// Check if already authenticated
if (localStorage.getItem('token')) {
  window.location.href = "/";
}

function loginWithGoogle() {
  // Redirect to API Gateway auth endpoint
  window.location.href = "http://" + window.location.hostname + ":8000/auth/login/google";
}
</script>

</body>
</html>
