<!DOCTYPE html>
<html>
<head>
  <title>CODA Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-accent: #14b8a6;
      --color-accent-light: #5eead4;
      --color-accent-dark: #0f766e;
      --color-sidebar: #12141c;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(20, 184, 166, 0.35) 0%, rgba(20, 184, 166, 0) 45%),
        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.25) 0%, rgba(139, 92, 246, 0) 45%),
        var(--color-sidebar);
      padding: 20px;
    }

    .login-container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--color-accent-light) 0%, var(--color-accent) 55%, var(--color-accent-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #06231f;
    }

    .logo-text {
      font-size: 12px;
      color: #9297a5;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .content-section {
      text-align: center;
      margin-bottom: 26px;
    }

    h2 {
      color: #1b1d29;
      margin-bottom: 10px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: #666a78;
      font-size: 15px;
      margin-bottom: 26px;
    }

    .info-box {
      background: #f7f8fb;
      border-left: 3px solid var(--color-accent);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 22px;
      font-size: 13px;
      color: #4b4f5b;
      line-height: 1.6;
      text-align: left;
    }

    .google-login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      border: 1.5px solid #e6e8f0;
      border-radius: 12px;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      color: #1b1d29;
    }

    .google-login-btn:hover {
      background-color: #f7f8fb;
      border-color: var(--color-accent);
      box-shadow: 0 8px 20px rgba(20, 184, 166, 0.18);
      transform: translateY(-1px);
    }

    .google-login-btn:active {
      transform: translateY(0);
    }

    .google-logo {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    #message {
      color: #b3123a;
      margin-top: 18px;
      padding: 12px;
      background-color: #fde8ec;
      border-radius: 8px;
      display: none;
      font-size: 13.5px;
    }

    #message.show {
      display: block;
    }

    .footer-text {
      font-size: 12px;
      color: #9297a5;
      margin-top: 24px;
      text-align: center;
      line-height: 1.6;
    }

    .footer-text a {
      color: var(--color-accent-dark);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo-section">
    <div class="brand-mark">C</div>
    <div class="logo-text">CODA</div>
  </div>

  <div class="content-section">
    <h2>Data Discovery</h2>
    <p class="subtitle">Sign in to access the CODA platform</p>

    <div class="info-box">
      Secure Google authentication required. Your data is protected.
    </div>

    <button class="google-login-btn" onclick="loginWithGoogle()">
      <svg class="google-logo" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>
  </div>

  <p id="message"></p>

  <p class="footer-text">
    By signing in, you agree to our platform terms.<br>
    We never share your data without permission.
  </p>
</div>

<script>
// Check if already logged in via token in URL
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
if (token) {
  localStorage.setItem('token', token);
  window.history.replaceState({}, document.title, "/");
  window.location.href = "/";
}

// Check if already authenticated
if (localStorage.getItem('token')) {
  window.location.href = "/";
}

function loginWithGoogle() {
  // Redirect to API Gateway auth endpoint
  window.location.href = "http://" + window.location.hostname + ":8000/auth/login/google";
}
</script>

</body>
</html>
